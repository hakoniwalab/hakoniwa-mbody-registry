disable_existing:
  - body: "*"
    type: mesh

geoms:
  # Nearly all the mass sits low in the chassis between the wheels (the
  # batteries under the floor), so the roof does not make the cart top-heavy.
  - body: vehicle
    attrs:
      name: chassis_collision
      type: box
      pos: "0 0 -0.08"
      size: "1.40 0.42 0.10"
      mass: "320"
      rgba: "0.18 0.22 0.24 1"
      condim: "4"
      friction: "1.1 0.01 0.001"
      solref: "0.01 1"
      solimp: "0.9 0.95 0.001"

  # The body up to the seat backs: massless, so it takes part in contacts
  # without changing the vehicle's mass and inertia.
  - body: vehicle
    attrs:
      name: body_collision
      type: box
      pos: "-0.085 0 0.30"
      size: "1.545 0.62 0.42"
      density: "0"
      rgba: "0 0 0 0"
      condim: "4"
      friction: "1.1 0.01 0.001"
      solref: "0.01 1"
      solimp: "0.9 0.95 0.001"

  # The roof, massless as well.
  - body: vehicle
    attrs:
      name: roof_collision
      type: box
      pos: "-0.39 0 1.98"
      size: "1.35 0.68 0.06"
      density: "0"
      rgba: "0 0 0 0"
      condim: "4"
      friction: "1.1 0.01 0.001"
      solref: "0.01 1"
      solimp: "0.9 0.95 0.001"

  # Keep the physical tread narrower than the visual tire. A full-width rigid
  # cylinder creates an unrealistic contact patch that resists kingpin motion.
  - body: front_left_wheel
    attrs: &wheel_collision
      name: front_left_tire
      type: cylinder
      size: "0.27 0.04"
      euler: "1.57079632679 0 0"
      mass: "7"
      rgba: "0 0 0 0"
      condim: "3"
      friction: "1.6 0.02 0.002"
      solref: "0.01 1"
      solimp: "0.9 0.95 0.001"
  - body: front_right_wheel
    attrs:
      <<: *wheel_collision
      name: front_right_tire
  - body: rear_left_wheel
    attrs:
      <<: *wheel_collision
      name: rear_left_tire
  - body: rear_right_wheel
    attrs:
      <<: *wheel_collision
      name: rear_right_tire
