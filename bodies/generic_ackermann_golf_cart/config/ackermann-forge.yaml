version: 1
kind: ackermann_vehicle
body: generic_ackermann_golf_cart

source:
  type: local_mjcf
  path: config/model.xml
  output:
    basename: model

adaptations: {}

# This is a model-port acceptance contract, not runtime controller policy.
validation:
  interface:
    base_freejoint: base_freejoint
    joints:
      steering_left: front_left_steer_joint
      steering_right: front_right_steer_joint
      drive_left: rear_left_wheel_joint
      drive_right: rear_right_wheel_joint
    actuators:
      steering_left: front_left_steer_motor
      steering_right: front_right_steer_motor
      drive_left: rear_left_wheel_motor
      drive_right: rear_right_wheel_motor
  geometry:
    wheelbase_m: 1.55
    track_width_m: 1.04
    wheel_radius_m: 0.25
    max_center_steering_rad: 0.70
    max_wheel_angular_velocity_rad_s: 20.0
  scenarios:
    settle_sec: 1.0
    idle_sec: 3.0
    straight: {speed_m_s: 1.0, duration_sec: 3.0}
    turn: {speed_m_s: 3.5, center_steering_rad: 0.35, duration_sec: 3.0}
  tolerances:
    idle_horizontal_drift_m: 0.02
    idle_vertical_drift_m: 0.02
    straight_min_forward_m: 2.0
    straight_max_lateral_m: 0.10
    straight_max_yaw_rad: 0.05
    steering_tracking_error_rad: 0.05
    drive_tracking_error_rad_s: 1.0
    turn_min_forward_m: 1.5
    turn_min_abs_yaw_rad: 1.5
    turn_max_yaw_asymmetry_ratio: 0.20
    max_step_translation_m: 0.05
    rtf_required_min: 1.0
    rtf_advisory_min: 1.0
  evaluation:
    score:
      method: weighted_tolerance_ratio
      # User-visible priorities. Values are relative weights, not percentages.
      weights:
        idle_horizontal_drift_m: 1.0
        straight_lateral_drift_m: 1.0
        straight_yaw_drift_rad: 1.0
        steering_tracking_rmse_rad: 2.0
        drive_tracking_rmse_rad_s: 1.0
        turn_yaw_asymmetry_ratio: 1.0
