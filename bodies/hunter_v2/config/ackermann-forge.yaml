version: 1
kind: ackermann_vehicle
body: hunter_v2

source:
  type: xacro
  definition: sources/hunter_v2.yaml
  entry: hunter_description/description/robot.urdf.xacro
  packages:
    hunter_description: hunter_description
  convert_dae_to_obj: true
  output:
    basename: hunter_v2

adaptations:
  # Gazebo plugins and ros2_control declarations are upstream runtime policy,
  # not part of the body converted to MuJoCo.
  remove_top_level_elements:
    - gazebo
    - ros2_control

  # The upstream Gazebo model couples these joints with URDF mimic tags.
  # Hakoniwa commands the left/right steering and drive actuators independently
  # so the Ackermann kinematics layer can calculate inner/outer wheel targets.
  remove_mimic_joints:
    - rear_right_wheel_joint
    - front_right_steering_joint

# Names and geometry are explicit so the same headless migration tests can be
# applied without teaching the validator anything Hunter-specific.
validation:
  interface:
    base_freejoint: base_freejoint
    joints:
      steering_left: front_left_steering_joint
      steering_right: front_right_steering_joint
      drive_left: rear_left_wheel_joint
      drive_right: rear_right_wheel_joint
    actuators:
      steering_left: front_left_steer_motor
      steering_right: front_right_steer_motor
      drive_left: rear_left_wheel_motor
      drive_right: rear_right_wheel_motor
  geometry:
    wheelbase_m: 0.65142
    track_width_m: 0.585
    wheel_radius_m: 0.164
    max_center_steering_rad: 0.461
    max_wheel_angular_velocity_rad_s: 10.0
  scenarios:
    settle_sec: 1.0
    idle_sec: 3.0
    straight: {speed_m_s: 0.8, duration_sec: 3.0}
    turn: {speed_m_s: 1.0, center_steering_rad: 0.25, duration_sec: 3.0}
  tolerances:
    idle_horizontal_drift_m: 0.02
    idle_vertical_drift_m: 0.02
    straight_min_forward_m: 1.0
    straight_max_lateral_m: 0.10
    straight_max_yaw_rad: 0.05
    steering_tracking_error_rad: 0.05
    drive_tracking_error_rad_s: 1.0
    turn_min_forward_m: 0.5
    turn_min_abs_yaw_rad: 0.5
    turn_max_yaw_asymmetry_ratio: 0.25
    max_step_translation_m: 0.05
    rtf_required_min: 1.0
    rtf_advisory_min: 1.0
  evaluation:
    score:
      method: weighted_tolerance_ratio
      weights:
        idle_horizontal_drift_m: 1.0
        straight_lateral_drift_m: 1.0
        straight_yaw_drift_rad: 1.0
        steering_tracking_rmse_rad: 2.0
        drive_tracking_rmse_rad_s: 1.0
        turn_yaw_asymmetry_ratio: 1.0
