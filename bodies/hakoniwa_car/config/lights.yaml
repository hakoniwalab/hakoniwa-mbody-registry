# The Hakoniwa Car's lights (tools/glb_add_lights.py, run by the Forge on the
# parts GLBs): the blue LEDs (front strip, eyes, sides, LiDAR ring) and the red
# tail lamps glow, and two head lamps light the way at night.
glow:
  - {rgba: [0.25, 0.65, 1.0], emissive: [0.1, 0.45, 1.0], strength: 2.0}    # blue LEDs
  - {rgba: [0.85, 0.12, 0.10], emissive: [1.0, 0.06, 0.03], strength: 2.0}  # tail lamps
  - {rgba: [1.0, 0.97, 0.86], emissive: [1.0, 0.9, 0.7], strength: 2.0}     # head lamps
lights:
  - {part: vehicle, name: head_light_left, type: spot, position: [1.13, 0.36, 0.05], direction: [1, 0, -0.06],
     color: [1.0, 0.95, 0.85], intensity: 45, range: 28, inner_cone_deg: 14, outer_cone_deg: 34}
  - {part: vehicle, name: head_light_right, type: spot, position: [1.13, -0.36, 0.05], direction: [1, 0, -0.06],
     color: [1.0, 0.95, 0.85], intensity: 45, range: 28, inner_cone_deg: 14, outer_cone_deg: 34}
