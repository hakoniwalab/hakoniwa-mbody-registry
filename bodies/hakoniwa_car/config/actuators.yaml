actuators:
  - type: position
    name: front_left_steer_motor
    joint: front_left_steer_joint
    ctrllimited: true
    ctrlrange: [-0.80, 0.80]
    kp: 1500
    kv: 70

  - type: position
    name: front_right_steer_motor
    joint: front_right_steer_joint
    ctrllimited: true
    ctrlrange: [-0.80, 0.80]
    kp: 1500
    kv: 70

  - type: velocity
    name: rear_left_wheel_motor
    joint: rear_left_wheel_joint
    ctrllimited: true
    ctrlrange: [-120, 120]
    kv: 300

  - type: velocity
    name: rear_right_wheel_motor
    joint: rear_right_wheel_joint
    ctrllimited: true
    ctrlrange: [-120, 120]
    kv: 300
