version: 1
kind: ackermann_vehicle
body: hakoniwa_truck
source:
  type: local_mjcf
  path: config/model.xml
  output: {basename: model}
adaptations: {}
variants:
  white: {path: config/model-white.xml}
  green: {path: config/model-green.xml}
validation:
  interface:
    base_freejoint: base_freejoint
    joints:
      steering_left: front_left_steer_joint
      steering_right: front_right_steer_joint
      drive_left: rear_left_wheel_joint
      drive_right: rear_right_wheel_joint
    actuators:
      steering_left: front_left_steer_motor
      steering_right: front_right_steer_motor
      drive_left: rear_left_wheel_motor
      drive_right: rear_right_wheel_motor
  geometry:
    wheelbase_m: 4.30
    track_width_m: 1.85
    wheel_radius_m: 0.45
    max_center_steering_rad: 0.50
    max_wheel_angular_velocity_rad_s: 75.0
  scenarios:
    settle_sec: 1.0
    idle_sec: 3.0
    # The force-limited 6 t vehicle needs longer than a passenger car to
    # reach a steady wheel-speed target; these durations test that response.
    straight: {speed_m_s: 5.0, duration_sec: 5.0}
    turn: {speed_m_s: 4.0, center_steering_rad: 0.20, duration_sec: 10.0}
  tolerances:
    idle_horizontal_drift_m: 0.04
    idle_vertical_drift_m: 0.04
    straight_min_forward_m: 8.0
    straight_max_lateral_m: 0.20
    straight_max_yaw_rad: 0.08
    steering_tracking_error_rad: 0.06
    drive_tracking_error_rad_s: 1.8
    turn_min_forward_m: 3.0
    turn_min_abs_yaw_rad: 0.35
    turn_max_yaw_asymmetry_ratio: 0.20
    max_step_translation_m: 0.10
    rtf_required_min: 1.0
    rtf_advisory_min: 1.0
  evaluation:
    score:
      method: weighted_tolerance_ratio
      weights: {idle_horizontal_drift_m: 1, straight_lateral_drift_m: 1, straight_yaw_drift_rad: 1,
                steering_tracking_rmse_rad: 2, drive_tracking_rmse_rad_s: 1, turn_yaw_asymmetry_ratio: 1}
