disable_existing:
  - {body: "*", type: mesh}
geoms:
  - body: vehicle
    attrs: {name: chassis_collision, type: box, pos: "0 0 0.12", size: "2.10 0.78 0.25", mass: "1152",
            rgba: "0 0 0 0", condim: "4", friction: "1.1 0.01 0.001", solref: "0.01 1", solimp: "0.9 0.95 0.001"}
  - body: vehicle
    attrs: {name: cabin_collision, type: box, pos: "-0.15 0 0.72", size: "1.65 0.84 0.48", density: "0",
            rgba: "0 0 0 0", condim: "4", friction: "1.1 0.01 0.001", solref: "0.01 1", solimp: "0.9 0.95 0.001"}
  # priority 1: a tyre's contact parameters win over the surface's (MuJoCo), so the tyre's
  # friction is the road condition and can be changed at run time (Urban's tire_friction PDU,
  # road_friction x tire_grip); hakoniwa-scenario M4-3.
  - body: front_left_wheel
    attrs: &wheel {name: front_left_tire, type: cylinder, size: "0.31 0.055", euler: "1.57079632679 0 0",
                   mass: "12", rgba: "0 0 0 0", condim: "3", friction: "1.6 0.02 0.002",
                   solref: "0.01 1", solimp: "0.9 0.95 0.001", priority: "1"}
  - {body: front_right_wheel, attrs: {<<: *wheel, name: front_right_tire}}
  - {body: rear_left_wheel, attrs: {<<: *wheel, name: rear_left_tire}}
  - {body: rear_right_wheel, attrs: {<<: *wheel, name: rear_right_tire}}
