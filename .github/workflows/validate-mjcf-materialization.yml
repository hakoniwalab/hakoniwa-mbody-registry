name: Validate MJCF materialization

on:
  pull_request:
    paths:
      - 'tools/forge.sh'
      - 'tools/fetch.py'
      - 'tools/validate_mjcf_assets.py'
      - 'sources/shadow_hand.yaml'
      - '.github/workflows/validate-mjcf-materialization.yml'
  push:
    branches: [main]
    paths:
      - 'tools/forge.sh'
      - 'tools/fetch.py'
      - 'tools/validate_mjcf_assets.py'
      - 'sources/shadow_hand.yaml'
      - '.github/workflows/validate-mjcf-materialization.yml'

jobs:
  shadow-hand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: python -m pip install PyYAML

      - name: Check forge shell syntax
        run: bash -n tools/forge.sh

      - name: Check validator syntax
        run: python -m py_compile tools/validate_mjcf_assets.py

      - name: Materialize and validate Shadow Hand
        run: ./tools/forge.sh sources/shadow_hand.yaml bodies/shadow_hand/source
